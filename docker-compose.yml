# Local development stack: Postgres + the Flask API.
#
# The Expo frontend is intentionally NOT containerised. Metro has to be
# reachable from a physical phone on your LAN, which means host networking and
# a correct REACT_NATIVE_PACKAGER_HOSTNAME; running it in a container makes
# that harder for no benefit. Run it on the host instead:
#
#   cd BudgetBuddy && npx expo start
#
# Usage:  docker compose up --build
services:
  db:
    image: postgres:15-alpine
    container_name: budgetbuddy_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: budgetbuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # The API runs init_db.py on startup, so Postgres must be accepting
    # connections first - "depends_on" alone only waits for the container
    # to be created, not for the server to be ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d budgetbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: budgetbuddy_backend
    environment:
      # Local Postgres is a direct connection, so LISTEN/NOTIFY works here.
      - DATABASE_URL=postgresql://user:password@db:5432/budgetbuddy
      - JWT_SECRET_KEY=dev-only-jwt-secret-change-in-production
      - SECRET_KEY=dev-only-secret-change-in-production
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
